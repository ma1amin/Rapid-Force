kind = "web"
previewPath = "/"
title = "Rapid Force Cyber Fusion"
version = "1.0.0"
id = "artifacts/cyber-fusion"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18259

[services.development]
run = "pnpm --filter @workspace/cyber-fusion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cyber-fusion", "run", "build" ]
publicDir = "artifacts/cyber-fusion/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18259"
BASE_PATH = "/"
